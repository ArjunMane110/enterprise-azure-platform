trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

variables:
  terraformVersion: '1.7.5'
  workingDirectory: '$(Build.SourcesDirectory)/enterprise-azure-platform/workloads/dev'

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: 'Azure Login'
    inputs:
      azureSubscription: '$(azureServiceConnection)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        echo "Logging into Azure"
        az account show

  - task: TerraformInstaller@1
    displayName: 'Install Terraform'
    inputs:
      terraformVersion: '$(terraformVersion)'

  - script: |
      cd "$(workingDirectory)"
      terraform init -input=false
      terraform plan -out=tfplan.out -input=false -lock=false
      terraform show -no-color tfplan.out
    displayName: 'Terraform Plan'
    env:
      ARM_CLIENT_ID: '$(ARM_CLIENT_ID)'
      ARM_CLIENT_SECRET: '$(ARM_CLIENT_SECRET)'
      ARM_SUBSCRIPTION_ID: '$(ARM_SUBSCRIPTION_ID)'
      ARM_TENANT_ID: '$(ARM_TENANT_ID)'

  - publish: '$(workingDirectory)/tfplan.out'
    displayName: 'Publish Terraform Plan'
    artifact: 'tfplan'
